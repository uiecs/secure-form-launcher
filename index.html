<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Secure Form Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell" aria-live="polite">
    <section class="card" id="passwordStep">
      <div class="brand"><span class="dot"></span><span>Secure Flow</span></div>
      <h1>رمز عبور</h1>
      <p class="hint">رمز عبور را فقط همین‌جا وارد کنید. مقدار آن ذخیره یا ارسال نمی‌شود.</p>
      <label class="field">
        <span>رمز عبور</span>
        <input id="password" type="password" autocomplete="new-password" inputmode="text" placeholder="••••••••" autofocus />
      </label>
      <button class="primary" id="nextButton" type="button">مرحله بعد</button>
      <p class="status" id="passwordStatus"></p>
    </section>

    <section class="card hidden" id="captchaStep">
      <div class="topline"><button class="back" id="backButton" type="button">بازگشت</button><span class="step">مرحله ۲ از ۲</span></div>
      <h1>تأیید CAPTCHA</h1>
      <p class="hint">CAPTCHA را خودتان در مرورگر تکمیل کنید. این برنامه CAPTCHA را حل یا دور نمی‌زند.</p>
      <div class="browser-frame" aria-label="محیط مرورگر برای CAPTCHA">
        <div class="browser-bar"><span class="traffic">● ● ●</span><span class="address">instagram.com</span></div>
        <div class="browser-body">
          <div class="captcha-placeholder">
            <div class="shield">✓</div>
            <strong>محیط آماده است</strong>
            <span>CAPTCHA را در پنجره مرورگر بازشده تکمیل کنید.</span>
            <button class="secondary" id="openButton" type="button">باز کردن مرورگر</button>
          </div>
        </div>
      </div>
      <button class="primary" id="confirmButton" type="button">تأیید و ادامه</button>
      <p class="status" id="captchaStatus"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
